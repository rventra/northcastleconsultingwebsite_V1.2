<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Operating Pack</title>
<meta name="description" content="Operating reporting pack for Meridian Injury Law — fourteen driver-based views computed from a seeded synthetic dataset.">
<style>
:root{
  --page:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--grid:#e1e0d9;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --nav-w:216px;--panel-w:284px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.42}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:20px}
h2{font-size:14.5px;margin-bottom:6px}
h3{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
p{margin:0 0 8px}
a{color:var(--s1)}
.num,td.num,th.num,.tile .v,.spark-v{font-variant-numeric:tabular-nums}
/* header */
header.top{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
header.top .firm{font-weight:700;font-size:17px}
header.top .sub{color:var(--ink2);margin-left:10px}
header.top .meta{flex:1;color:var(--ink2);font-size:13px}
header.top .disc{color:var(--critical);font-weight:500}
header.top .tag{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.filters{display:flex;align-items:center;gap:14px;padding:8px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.filters label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.filters select{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 8px;min-width:120px}
.filters select:disabled{opacity:.5}
.filters .hint{font-size:12px;color:var(--muted);flex:1;min-width:200px}
.filters .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* shell */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:calc(100vh - 100px)}
nav.side{border-right:1px solid var(--border);background:var(--card);padding:12px 10px;position:sticky;top:46px;align-self:start;max-height:calc(100vh - 46px);overflow:auto}
nav.side button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13px;line-height:1.25}
nav.side button .n{font-variant-numeric:tabular-nums;color:var(--muted);width:18px;flex:none;font-size:12px}
nav.side button:hover{background:rgba(11,11,11,.05)}
nav.side button.active{background:var(--ink);color:#fff}
nav.side button.active .n{color:rgba(255,255,255,.7)}
nav.side button:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
main.content{max-width:1400px;padding:18px 24px 48px;width:100%}
.view{display:none}
.view.active{display:block}
.vhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.vhead .t{flex:1;min-width:280px}
.vhead .driver{color:var(--ink2);font-size:13px;margin-top:2px}
.vhead .disc{font-size:12px;color:var(--muted)}
.bench-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bench-strip .chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink2);white-space:nowrap}
.bench-strip .chip b{color:var(--ink);font-weight:600}
.bench-strip .chip .src{color:var(--muted)}
.bench-strip .lbl{font-size:12px;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.04em}
.vbody{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:20px;align-items:start}
body.nopanel .vbody{grid-template-columns:minmax(0,1fr)}
body.nopanel aside.vpanel{display:none}
.vmain{min-width:0;display:grid;gap:12px}
aside.vpanel{display:grid;gap:12px;position:sticky;top:62px}
aside.vpanel .block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
aside.vpanel .block h3{margin-bottom:4px}
aside.vpanel .block p{margin:0}
aside.vpanel .bench{display:grid;gap:6px}
aside.vpanel .bench .row{display:flex;justify-content:space-between;gap:8px;font-size:12px}
aside.vpanel .bench .row b{color:var(--ink);font-weight:600;text-align:right;flex:none;max-width:55%}
aside.vpanel .bench .row .src{color:var(--muted)}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;min-width:0}
.card .sub{font-size:12px;color:var(--muted);margin-top:6px}
.card .src{font-size:11px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1180px){.row3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1320px){.tiles.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1180px){.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px 8px;min-width:0}
.tile .l{font-size:11.5px;color:var(--ink2);line-height:1.25}
.tile .v{font-size:19px;font-weight:600;line-height:1.1;margin-top:2px;letter-spacing:-.01em}
.tile .d{font-size:11px;margin-top:2px;color:var(--ink2);line-height:1.3}
.tile .src{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.25}
.tile.small .v{font-size:16.5px}
.up{color:var(--good)}.down{color:var(--critical)}
/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap}
.st .i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;line-height:1;font-weight:700}
.st0 .i{background:var(--good)}.st1 .i{background:var(--warn)}.st2 .i{background:var(--serious)}.st3 .i{background:var(--critical)}
.st0{color:var(--good)}.st1{color:#8a6100}.st2{color:#b35a2c}.st3{color:var(--critical)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:middle}
th{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;font-weight:600;background:transparent}
th.num,td.num{text-align:right}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort.on::after{content:" ▾";color:var(--s1)}
th.sort.on.asc::after{content:" ▴"}
tr.vacant td{background:rgba(250,178,25,.12);color:var(--ink2);font-style:italic}
tr.total td{font-weight:600;border-top:2px solid var(--grid)}
.tbl-wrap{overflow-x:auto}
td .spark{vertical-align:middle;margin-right:4px}
.mini{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.btn:hover{background:rgba(11,11,11,.04)}
select.inline{border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:#fff;font-size:12px}
/* charts */
.chart{display:block;max-width:100%}
.chart text{font-family:inherit;font-size:11px;fill:var(--ink2)}
.chart text.ax{fill:var(--muted);font-size:11px}
.chart text.lab{fill:var(--ink);font-size:11px;paint-order:stroke;stroke:#fcfcfb;stroke-width:3px;stroke-linejoin:round}
.chart text.ref{fill:var(--ink2);font-size:11px}
.chart .hover:hover{opacity:.8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px}
.legend i.line{height:2px;border-radius:0;width:16px}
.legend i.dash{height:0;border-top:2px dashed;width:16px;background:transparent}
.legend i.hatch{background:repeating-linear-gradient(45deg,#e87ba4 0 2px,#fff 2px 4px)}
.legend i.band{background:rgba(11,11,11,.08)}
#tip{position:absolute;display:none;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:320px;z-index:50;line-height:1.35}
/* scorecard */
.sc td.m{padding:4px 6px}
.sc .cell{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;min-width:92px}
.sc .cell .v{font-weight:600;font-variant-numeric:tabular-nums}
.sc .cell .sp{grid-column:1/3}
/* funnel */
.funnel{display:grid;gap:6px}
/* heatmap legend */
.hm-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.hm-legend .bar{display:inline-block;width:120px;height:10px;border-radius:2px;background:linear-gradient(90deg,#2a78d6,#f0efec 50%,#e34948)}
.bridge{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px;font-size:12px;color:var(--ink2);margin-top:8px}
.bridge span b{color:var(--ink);font-weight:600}
/* calculator */
.sliders{display:grid;gap:10px}
.slider{display:grid;grid-template-columns:1fr 110px;gap:4px 12px;align-items:center;font-size:13px}
.slider input[type=range]{width:100%;grid-column:1/2}
.slider .cur{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.slider .lbl{display:flex;justify-content:space-between;color:var(--ink2)}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink2);background:rgba(11,11,11,.03);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{font-weight:600}
.note{font-size:12px;color:var(--ink2);background:rgba(42,120,214,.06);border-left:3px solid var(--s1);padding:8px 10px;border-radius:0 8px 8px 0}
.rag{display:flex;gap:10px;flex-wrap:wrap}
.rag .tile{flex:1;min-width:140px}
.quad-names{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:var(--muted)}
ul.tight{margin:0;padding-left:18px}
ul.tight li{margin:2px 0}
.hatched{background:repeating-linear-gradient(45deg,#e87ba4 0 2px,#fff 2px 4px)}
/* responsive */
@media (max-width:1180px){.vbody{grid-template-columns:minmax(0,1fr)}aside.vpanel{position:static;order:-1;grid-template-columns:repeat(2,minmax(0,1fr))}aside.vpanel .block.bench{grid-column:1/3}}
@media (max-width:1024px){.shell{grid-template-columns:1fr}nav.side{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;border-right:0;border-bottom:1px solid var(--border)}nav.side button{width:auto}nav.side.collapsed button:not(.active):not(.toggle){display:none}nav.side button.toggle{display:inline-flex}.row2{grid-template-columns:1fr}.row3{grid-template-columns:1fr}}
nav.side .toggle{display:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;background:#fff;cursor:pointer;margin-left:auto;align-self:center}
@media print{
  @page{size:landscape;margin:12mm}
  .filters,nav.side,#tip{display:none!important}
  .shell{display:block}
  main.content{max-width:none;padding:0}
  .view{display:none!important}.view.active{display:block!important}
  .vbody{grid-template-columns:1fr}
  aside.vpanel{position:static;order:1;grid-template-columns:repeat(2,1fr)}
  .card,.tile,aside.vpanel .block{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}
.drv{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:18px;align-items:start}
.drv .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#898781;margin-bottom:4px}
.drv .v{font-size:22px;font-weight:700;line-height:1.2}
.drv .d{font-size:12px;color:#52514e;margin-top:4px}
.drv p{margin:0;font-size:13px;color:#52514e;line-height:1.45}
.drv-money{border-left:1px solid rgba(11,11,11,.10);border-right:1px solid rgba(11,11,11,.10);padding:0 18px}
.drv-foot{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(11,11,11,.10)}
.drv-foot .btn{white-space:nowrap}
.sub-inline{font-weight:400;color:#898781;font-size:14px}
@media(max-width:1180px){.drv{grid-template-columns:1fr}.drv-money{border:0;padding:0}}
.calcbox{margin-top:14px;padding-top:12px;border-top:1px solid rgba(11,11,11,.10)}
.calcbox .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#898781;margin-bottom:6px}
table.calc{width:100%;border-collapse:collapse;font-size:12.5px}
table.calc td{padding:4px 8px;border-bottom:1px solid rgba(11,11,11,.06);color:#52514e;vertical-align:top}
table.calc td.num{text-align:right;font-variant-numeric:tabular-nums;color:#0b0b0b;white-space:nowrap;width:150px}
table.calc td.mini{color:#898781;font-size:11.5px;width:33%}
table.calc tr.last td{border-bottom:0;font-weight:700;color:#0b0b0b;padding-top:7px;border-top:1px solid rgba(11,11,11,.18)}
table.mtx td.num{border:1px solid #fff}
table.mtx tr.total td{font-weight:700}
.bench-strip .chip sup.fn{color:var(--muted);font-size:9px;margin-left:2px;font-weight:600}
aside.vpanel .bench .row sup.fn{color:var(--muted);font-size:9px;margin-left:2px}
.nav-notes{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.nav-notes h4{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 10px 7px;font-weight:600}
.nav-notes .fnote{display:flex;gap:5px;padding:0 10px 7px;font-size:10.5px;line-height:1.35;color:var(--muted)}
.nav-notes .fnote sup{color:var(--ink2);font-weight:600;flex:none;font-size:9px}
.nav-notes .fnote i{font-style:italic}
.nav-notes .fnote-tail{padding:6px 10px 0;font-size:10px;line-height:1.35;color:var(--muted);border-top:1px solid var(--border);margin-top:4px}
@media print{.nav-notes{display:none}}
.tile .l sup.fn{color:var(--muted);font-size:9px;margin-left:3px;font-weight:600}
.sub sup.fn.dsrc{color:var(--muted);font-size:9px;margin-left:2px;font-weight:600}
.card h2 sup.fn{color:var(--muted);font-size:9px;margin-left:3px;font-weight:600}
.nav-notes h4.dsrc-h{margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
</style>
</head>

<header class="top">

    // 1 answer / STL
    { const st=Math.max(SC[0].st(r.contactRate),r.speedToLeadSec>B.speedToLeadSec.target?(r.speedToLeadSec>40?2:1):0); rows.push({n:1,alert:'Contact rate / speed-to-lead',office:name,value:`${fmt.pct(r.contactRate)} answered · median STL ${r.speedToLeadSec} s`,threshold:`Answer <${fmt.pct(B.contactRate.target,0)} or STL >${B.speedToLeadSec.target} s`,owner:'Intake manager',cadence:'Daily',st,breach:r.contactRate<B.contactRate.target||r.speedToLeadSec>B.speedToLeadSec.target}); }
    // 2 sign rate
    { const st=SC[1].st(r.signRate); rows.push({n:2,alert:'Sign rate (qualified→signed)',office:name,value:`${fmt.pct(r.signRate)} on ${fmt.int(r.qualified)} qualified`,threshold:`<${fmt.pct(B.leadToSign.target,0)} for any source with >20 leads`,owner:'Intake QA lead',cadence:'Weekly',st,breach:r.signRate<B.leadToSign.target}); }
    // 3 stalled / SOL
    { const sol=D.inventory.filter(x=>x.office===id&&x.daysToSOL<120&&!x.suitFiled).length; const st=Math.max(SC[3].st(r.stalledPct),sol>0?3:0); rows.push({n:3,alert:'Stalled files / SOL exposure',office:name,value:`${fmt.pct(r.stalledPct)} no-activity >90 d · ${sol} file${sol===1?'':'s'} <120 d to SOL without suit`,threshold:'>5% stalled, or any file <120 d to SOL w/o suit',owner:'Office managing attorney',cadence:'Weekly',st,breach:r.stalledPct>0.05||sol>0}); }
    // 4 capacity / retention
    { const over=D.caseManagers.filter(c=>c.office===id&&c.caseload>120).length; const ev=sum(D.opsMonthly.filter(x=>x.office===id&&W12.includes(x.month)),'cmTurnoverEvents'); const to=ev/o.cmDesks; const st=Math.max(over?2:0,to>B.turnover.max?(to>0.25?3:1):0); rows.push({n:4,alert:'Capacity / retention',office:name,value:`${over} desk${over===1?'':'s'} >120 files · turnover ${fmt.pct(to,0)} annualized (${ev} of ${o.cmDesks})`,threshold:`Any desk >120 files, or turnover >${fmt.pct(B.turnover.max,0)}`,owner:'Practice manager',cadence:'Weekly',st,breach:over>0||to>B.turnover.max}); }
    // 5 trust / disbursement
    { const st=Math.max(D.wc.trustReconExceptions>0?3:0,SC[9].st(r.releaseToDisburseDays)===3?3:r.releaseToDisburseDays>30?3:0); rows.push({n:5,alert:'Trust and disbursement',office:name,value:`${D.wc.trustReconExceptions} recon exceptions (firm) · ${r.releaseToDisburseDays} d release→disburse`,threshold:'Any 3-way recon exception, or >30 d',owner:'Controller',cadence:'Weekly (recon monthly)',st,breach:D.wc.trustReconExceptions>0||r.releaseToDisburseDays>30}); }
    // 6 cost per signed vs trailing-6 median
    { const hits=[]; let worst=0; CH.forEach(c=>{ if(!c.cpl) return; const cur=D.channelMonthly.find(x=>x.office===id&&x.month===LATEST&&x.channel===c.id); const prev=D.MONTHS.slice(-7,-1).map(m=>D.channelMonthly.find(x=>x.office===id&&x.month===m&&x.channel===c.id)).filter(x=>x&&x.costPerSigned).map(x=>x.costPerSigned); const med=median(prev); if(cur&&cur.costPerSigned&&med&&cur.costPerSigned>1.3*med){ hits.push(`${c.name} ${fmt.usd(cur.costPerSigned)} vs median ${fmt.usd(med)} (${fmt.num(cur.costPerSigned/med,2)}×)`); worst=Math.max(worst,cur.costPerSigned>1.6*med?2:1);} }); rows.push({n:6,alert:'Cost per signed case by channel',office:name,value:hits.length?hits.join('; '):'All channels within 1.3× of trailing-6 median',threshold:'Any channel >1.3× its trailing-6-month median',owner:'Marketing director',cadence:'Weekly',st:worst,breach:hits.length>0}); }
  });
  return rows;
}

function card(title,inner,sub){
  let note='';
  if(sub){ const m=String(sub).match(/Sources?:\s*[\s\S]*?(?=(?:\.\s+(?=[A-Z][a-z]{2,}))|$)/);
    if(m){ note=srcRef(m[0]); sub=(String(sub).slice(0,m.index)+String(sub).slice(m.index+m[0].length)).replace(/^\s*\.\s*/,'').replace(/\s{2,}/g,' ').trim(); } }
  const head=title?`<h2>${title}${note&&!sub?note:''}</h2>`:'';
  const cap=sub?`<div class="sub">${sub}${note}</div>`:(title?'':(note?`<div class="sub">${note}</div>`:''));
  return `<div class="card">${head}${inner||''}${cap}</div>`; }
function tile(l,v,d,src,cls=''){ return `<div class="tile ${cls}"><div class="l">${l}${srcRef(src)}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`; }

function scTable(specs){

      const rowFor=(name,owner,vals,spark,color)=>`<tr><td><b>${name}</b><div class="mini">${owner}</div></td>${specs.map((sp,i)=>{ const v=vals[i],st=sp.st(v); return `<td class="m"><div class="cell"><span class="st st${st}" data-tip="${esc(sp.label)}: ${esc(sp.f(v))} — ${ST[st].l} (plan ${esc(sp.target)}). Source: ${esc(sp.src)}"><span class="i">${ST[st].i}</span></span><span class="v">${sp.f(v)}</span><span class="sp">${sparkline(spark[i],110,18,color)}</span></div></td>`; }).join('')}</tr>`;

function velocityDetail(m,W,P,ids,cur,prev,detail){

      const dcell=(g,k)=>g.length?`${fmt.int(M_(g,k))} <span class="mini">(${fmt.int(g.length)})</span>`:'—';

        +vrow(`${scopeName()} — all resolved`,rc,'total');

        ${(()=>{ const v=M_(grp.all,'daysContactToSign'), pv2=M_(grpP.all,'daysContactToSign'); const d=pv2?(v-pv2)/pv2:null; const cls=d==null?'':(d<=0?'up':'down');
          return tile('Contact → signed',fmt.num(v,1)+' d',`${d==null?'':`<span class="${cls}">${d<=0?'▼':'▲'} ${Math.abs(d*100).toFixed(1)}%</span> vs prior`}${detail?` · non-lit <b>${fmt.num(M_(grp.non,'daysContactToSign'),1)}</b> · lit <b>${fmt.num(M_(grp.lit,'daysContactToSign'),1)}</b>`:''} · mean ${fmt.num(grp.all.length?grp.all.reduce((a,x)=>a+x.daysContactToSign,0)/grp.all.length:0,1)}`,'Lead Docket › lead.answered_at → lead.signed_at'); })()}
        ${mk('daysSignToDemand','Signed → demand sent','Filevine › project.signed_at → demand.sent_at')}

      <div class="ch" style="margin-top:12px"></div>`:''}`,

      m.appendChild(c);

function demandsUtil(m,W,ids,cur,byOffice){
      const weeks=W.length*4.33;
      // build the firm figures from the office figures so the strip ties to the by-office table
      const perOff=ids.map(oid=>{ const a=aggOps(opsRows(W,[oid])); const t=Math.max(1,Math.round(a.cmDesks/3)); return {a,t,sent:Math.round(a.demands*t*weeks)}; });
      const teams=perOff.reduce((x,o)=>x+o.t,0)||1;
      const demandsSent=perOff.reduce((x,o)=>x+o.sent,0);
      const demandsMonth=ids.reduce((x,oid)=>{ const a=aggOps(opsRows([LATEST],[oid])); return x+Math.round(a.demands*Math.max(1,Math.round(a.cmDesks/3))*4.33); },0);
      const perTeamWk=demandsSent/(teams*weeks);
      const perFTE=cur.staffedDesks?demandsSent/weeks/cur.staffedDesks:0;
      const backlog=invLit().filter(x=>x.stage==='Demand'&&x.lastActivityDays>14);
      const bStat=backlog.length>40?3:backlog.length>20?2:0;
      m.appendChild(h(card(`Demands sent — utilization, ${pl()}`,`<div class="tiles four">
        ${tile('Demands sent',fmt.int(demandsSent),`${fmt.int(demandsMonth)} in ${fmt.month(LATEST)} · leading indicator of fees 9–14 months out`,'Filevine › demand.sent_at')}
        ${tile('Demands per team-week',fmt.num(perTeamWk,1),`${stIcon(perTeamWk>=4?0:perTeamWk>=3?2:3)} · benchmark ≥4 (PELA) · ${teams} pre-lit teams`,'demand.sent_at ÷ teams ÷ weeks')}
        ${tile('Demands per CM per week',fmt.num(perFTE,2),`${fmt.int(cur.staffedDesks)} staffed desks · utilization of the demand step`,'demand.sent_at ÷ staffed case-manager desks')}
        ${tile('Backlog: ready, no demand out',fmt.int(backlog.length),`${stIcon(bStat)} · files in demand stage idle >14 d · the ownerless gap`,'project.phase = Demand, last_activity_at > 14 d')}
      </div>
      ${(()=>{
        const TODAY=new Date(D.FIRM.asOf+'T00:00:00Z'), ago=(iso)=>Math.round((TODAY-new Date(iso+'T00:00:00Z'))/86400000);
        const SENT=D.STAGES.indexOf('Demand');
        const pool=[];
        invLit().forEach(x=>pool.push({office:x.office,age:ago(x.signDate),sent:D.STAGES.indexOf(x.stage)>SENT}));
        D.resolvedCases.filter(x=>offOk(x)&&segOk(x)&&litOk(x)).forEach(x=>pool.push({office:x.office,age:ago(x.signDate),sent:true}));
        if(state.segment==='ALL'&&state.lit==='ALL') D.droppedCases.filter(offOk).forEach(x=>pool.push({office:x.office,age:ago(x.signDate),sent:false}));
        const BK=[[0,30,'0–30 d'],[31,60,'31–60 d'],[61,90,'61–90 d'],[91,120,'91–120 d'],[121,180,'121–180 d'],[181,365,'181–365 d'],[366,1e9,'365 d+']];
        const cell=(g)=>{ if(!g.length) return '<td class="num mini">—</td>'; const pctv=g.filter(x=>x.sent).length/g.length;
          const bg=SEQ[Math.min(6,Math.round(pctv*6))], ink=pctv>0.55?'#fff':'#0b0b0b';
          return `<td class="num" style="background:${bg};color:${ink}" data-tip="${fmt.int(g.filter(x=>x.sent).length)} of ${fmt.int(g.length)} cases signed in this window have a demand out">${fmt.pct(pctv)}<div class="mini" style="color:${ink};opacity:.75">${fmt.int(g.filter(x=>x.sent).length)} of ${fmt.int(g.length)}</div></td>`; };
        const row=(label,f)=>`<tr><td>${label}</td>${BK.map(([lo,hi])=>cell(pool.filter(x=>f(x)&&x.age>=lo&&x.age<=hi))).join('')}</tr>`;
        return `<div class="tbl-wrap" style="margin-top:12px"><table class="mtx"><thead><tr><th>${byOffice?'Office':'Signed cohort'}</th>${BK.map(b=>`<th class="num">${b[2]}</th>`).join('')}</tr></thead><tbody>
          ${byOffice?D.OFFICES.filter(o=>ids.includes(o.id)).map(o=>row(o.name,x=>x.office===o.id)).join(''):''}
          <tr class="total">${row(byOffice?'Firm':scopeName(),()=>true).slice(4)}</tbody></table></div>`;
      })()}`,
      'Demand volume today is fee revenue 9–14 months out — the most controllable number in the firm. The matrix reads across: of the cases signed in each window, what share now has a demand out; each cell shows that count over every case signed in the window (open, resolved and dropped). The first two columns are near zero by design — that is the treatment window, not a failure. The ramp starts around day 60 and should cross 50% near each office\'s median signed→demand time; read it against the velocity strip above as a consistency check. Tampa crosses by the 91–120 cohort (median 75 d); Phoenix is still at 16% there and only reaches 63% by 121–180 (median 168 d). Demands sent is derived from demands per team-week × teams × weeks in this dataset; on real data it is a count of demand.sent_at.')));
}

VIEWS.push({id:'flash',n:1,label:'Executive flash',title:'Executive flash',driver:'Driver: fee revenue vs plan · Owner: CEO / owner / sponsor',segment:'segment',bench:['contactRate','leadToSign','cycleDays','marketingPctFees','feeRealization','flashDays'],
  panel:{what:'The Monday page for the owner and sponsor: fee revenue against the prior period, signed and resolved volume, the two intake rates that decide next year\'s fees, and the probability-weighted inventory that is the deferred-revenue analogue.',lever:'Fee revenue = desks × staffed % × throughput per desk × fee-resolution rate × fee per resolved case. Signed = raw contacts × contact rate × qualified rate × sign rate × (1 − 30-day drop).',owner:'CEO / owner / sponsor. Flash within 3–5 days of month end; each exception row has its named owner and cadence from framework §9.',guardrail:'Cash fees only — no accrued WIP revenue (Slater & Gordon trap). Every tile shows the source system and field it is computed from.',bench:['contactRate','leadToSign','feeRealization','flashDays','closeDays']},

    const recSt=cur.costRecovery>=0.90?0:(cur.costRecovery>=0.85?2:3);
    m.appendChild(h(`<div class="tiles five">
      ${tile('Net fees '+pl(),fmt.money(cur.netFees),fmt.delta(cur.netFees,prev.netFees)+' '+pl(),'QuickBooks \u203a gl.fee_revenue_4000, net of referral fees out')}
      ${tile('Signed cases '+pl(),fmt.int(cur.signed),fmt.delta(cur.signed,prev.signed),'Lead Docket \u203a lead.signed_at')}

      ${tile('Contact rate '+pl(),fmt.pct(cur.contactRate),`${stIcon(SC[0].st(cur.contactRate))} \u00b7 ${fmt.pts(cur.contactRate-prev.contactRate)} vs prior \u00b7 target \u2265${fmt.pct(B.contactRate.target,0)}`,'Lead Docket \u203a lead.answered_at; CallRail \u203a call.answered')}
      ${tile('Qualified\u2192sign rate '+pl(),fmt.pct(cur.signRate),`${stIcon(SC[1].st(cur.signRate))} \u00b7 ${fmt.pts(cur.signRate-prev.signRate)} vs prior`,'Lead Docket \u203a lead.signed_at \u00f7 lead.qualified_at')}
      ${tile('Open inventory, PW value',fmt.money(pw),`PV @10% ${fmt.money(pvv)} \u00b7 ${fmt.int(inv.length)} files${segNote}`,'Filevine \u203a project.est_recovery \u00d7 fee_pct \u00d7 phase probability')}
      ${tile('Marketing cost per signed case',fmt.usd(cpsC),`${costDelta(cpsC,cpsP)} vs prior \u00b7 paid channels only`,'ad platforms \u203a spend \u00f7 Lead Docket \u203a lead.signed_at')}
      ${tile('Marketing % of net fees',fmt.pct(mpC),`${stIcon(inBand?0:(mpC<mkB[0]?1:2))} \u00b7 ${fmt.pts(mpC-mpP)} vs prior \u00b7 band ${fmt.pct(mkB[0],0)}\u2013${fmt.pct(mkB[1],0)}`,'ad platforms \u203a spend \u00f7 QuickBooks \u203a gl.fee_revenue_4000')}
      ${tile('Case costs advanced per signed case',fmt.usd(advC),`${stIcon(recSt)} ${fmt.pct(cur.costRecovery)} recovered at disbursement \u00b7 target \u226590%`,'Filevine \u203a settlement.costs_advanced \u00f7 lead.signed_at')}
      ${tile('Acquire + carry per signed case',fmt.usd(allC),`${costDelta(allC,allP)} vs prior \u00b7 against ${fmt.usd(cur.feePerResolved)} fee per resolved case`,'Marketing cost per signed + case costs advanced per signed')}
    </div>`));
    m.appendChild(h(`<div class="note">Top row is the result; bottom row is what a case costs to buy and carry against what it returns. Marketing is paid channels only \u2014 referral and past-client cases carry no acquisition cost, which is why the blended figure sits below the per-channel ranges. Advanced case costs are recovered from the client's share at disbursement, so the ${fmt.pct(1-cur.costRecovery)} that is not recovered is the real leakage.${srcRef('ad platforms \u203a spend; Filevine \u203a settlement.costs_advanced, cost_recovered')}</div>`));
    // ---------- funnel, with vs-prior on every stage ----------
    { const cF=h(card(`Funnel, ${pl()} — ${scopeName()}`,'<div class="ch"></div>','Source: Lead Docket \u203a lead.created_at \u2192 answered_at \u2192 qualified_at \u2192 signed_at \u2192 dropped_at (\u226430 d). Retained-30d = signed \u2212 30-day drops. Each stage carries its movement against the prior '+state.period+' months; "of prior stage" is the conversion within this period.'));
      m.appendChild(cF);

VIEWS.push({id:'scorecard',n:3,label:'Office scorecard',title:'Office scorecard',driver:'Driver: resolved cases per desk per month · Owner: office managing attorney',segment:false,bench:['contactRate','leadToSign','demandsPerTeamWk','cmCaseload','cycleDays','turnover'],

    sl.querySelectorAll('input[type=range]').forEach(inp=>inp.addEventListener('input',()=>{ const k=inp.getAttribute('data-k'); vals[k]=+inp.value; document.getElementById('cv-'+k).textContent=S.find(x=>x.k===k).f(vals[k]); calc(); }));
    calc();
  }
});

VIEWS.push({id:'drivers',n:2,label:'Value drivers',title:'Value drivers — the five that move the number',driver:'Driver: where the next dollar of EBITDA comes from · Owner: CEO / owner / sponsor',segment:false,

      const chC=chRows(W,ids), paidSp=sum(chC.filter(r=>r.channel!=='REF'&&r.channel!=='WOM'),'spend'), paidSg=sum(chC.filter(r=>r.channel!=='REF'&&r.channel!=='WOM'),'signed');
      const mcac=paidSg?1.5*(paidSp/paidSg):0, absorb=Math.min(freed,paidSp*0.25);
      const cases=mcac?absorb/mcac:0, f=cases*K.frr*K.fpr, gross=f*K.FLOW;
      const interest=absorb*D.wc.lineOfCredit.rate, recG=Math.max(0,0.94-K.rec)*K.adv, e=gross-interest+recG;
      CALC[4]={rows:[
        ['Case costs self-funded on the balance sheet',Mn(selfF),''],
        ['× 60% advance rate on a case-cost line',Mn(freed)+' freed',''],
        ['Absorbable into acquisition (25% of current paid spend)',Mn(absorb),'the rest strengthens the balance sheet'],
        ['÷ marginal CAC '+U(mcac)+' (1.5× blended paid)',R(cases)+' cases',''],
        ['× fee-resolution × fee per resolved × '+P(K.FLOW,0),Mn(gross),''],
        ['− interest on the drawn amount at '+P(D.wc.lineOfCredit.rate,1),'−'+Mn(interest),''],
        ['+ recovery discipline '+P(K.rec)+' → 94% on '+Mn(K.adv)+' advanced','+'+Mn(recG),'pure margin, no new cases'],
        ['= run-rate EBITDA',Mn(e),'']
      ],ebitda:e,fees:f,cases:cases};
    }
    { // 5 — retention and the referral engine
      const tgt=0.05, saved=K.signed*Math.max(0,K.drop-tgt);
      const chC=chRows(W,ids), womSg=sum(chC.filter(r=>r.channel==='WOM'),'signed'), womUp=womSg*0.15;
      const cases=saved+womUp, f=cases*K.frr*K.fpr, e=f*K.FLOW*CAPTURE[5];
      CALC[5]={rows:[
        ['30-day drop now vs '+P(tgt,0)+' target',P(K.drop),''],
        ['× signed cases '+R(K.signed),R(saved)+' cases saved',''],
        ['Past-client / word-of-mouth signed '+R(womSg)+' × 15% review-driven uplift',R(womUp)+' cases','zero acquisition cost'],
        ['= additional cases',R(cases),''],
        ['× fee-resolution '+P(K.frr)+' × fee per resolved '+U(K.fpr),Mn(f),''],
        ['× '+P(K.FLOW,0)+' flow-through × '+P(CAPTURE[5],0)+' captured',Mn(e),'']
      ],ebitda:e,fees:f*CAPTURE[5],cases:cases};
    }
    const DR=D.valueDrivers.map(d=>Object.assign({},d,{runRate:CALC[d.n].ebitda,fees:CALC[d.n].fees,oneTimeCash:CALC[d.n].cash||0}));
    const totalRun=DR.reduce((a,d)=>a+d.runRate,0), totalFees=DR.reduce((a,d)=>a+d.fees,0), oneTime=DR.reduce((a,d)=>a+(d.oneTimeCash||0),0);
    m.appendChild(h(card('',`<div class="tiles">
      ${tile('Run-rate EBITDA at stake',fmt.money(totalRun),'Five drivers, at '+Math.round(FLOW*100)+'% flow-through on incremental resolved cases')}
      ${tile('Fees at stake',fmt.money(totalFees),'Realizes over the case cycle, 8–18 months')}
      ${tile('One-time cash',fmt.money(oneTime),'Cycle-time reduction pulling fees forward')}
      ${tile('Fastest first reading',Math.min(...DR.map(d=>d.days))+' days','Intake conversion — the weekly indicator moves inside a week')}
    </div>
    <div class="note" style="margin-top:12px"><b>Shared inputs, all computed from ${pl()} at the current filter — every driver below is built from these.</b><br>
      Raw contacts ${R(K.raw)} · contact rate ${P(K.cr)} · qualified rate ${P(K.qr)} · sign rate ${P(K.sr)} · signed ${R(K.signed)} ·
      fee-resolution rate ${P(K.frr)} · fee per resolved case ${U(K.fpr)} · cycle ${R(K.cyc)} d · 30-day drop ${P(K.drop)} · case-cost recovery ${P(K.rec)}.<br>
      <b>Flow-through ${P(K.FLOW,0)}</b> on incremental resolved cases (net of case costs, variable case-manager and attorney comp, and referral fees out).
      <b>Capture ${P(CAPTURE[1],0)} of the measured gap in year one</b> on drivers 1, 2, 3 and 5 — the arithmetic below shows the full gap and the captured figure on the last line.
      Driver 4 is not capture-rated; it is constrained instead by what the marketing mix can absorb.</div>`,
    'Every figure is arithmetic on this firm\'s own numbers, not a forecast. Change the office or period filter and all of it recomputes.')));
    const c=h(card('Ranked by run-rate EBITDA at stake','<div class="ch"></div>'));
    m.appendChild(c);
    const shortName={1:'Intake conv.',2:'Cost/signed',3:'Case velocity',4:'Case-cost capital',5:'Retention'};
    barChart(c.querySelector('.ch'),{cats:DR.map(d=>d.n+'. '+shortName[d.n]),values:DR.map(d=>d.runRate),height:210,fmtV:fmt.money,color:PAL[0],
      tips:DR.map(d=>d.name+': '+fmt.money(d.runRate)+' run-rate EBITDA, '+fmt.money(d.fees)+' fees, first reading in '+d.days+' days')});
    DR.forEach(d=>{
      const r=read[d.n];
      const el=h(card(`${d.n}. ${d.name} <span class="sub-inline">— ${d.sub}</span>`,`
        <div class="drv">
          <div class="drv-now">
            <div class="l">Where the firm is now</div>
            <div class="v">${r.now}</div>
            <div class="d">${r.then}</div>
            <div class="d">${stIcon(r.s)} <span class="mini">Benchmark ${r.tgt}</span></div>
          </div>
          <div class="drv-money">
            <div class="l">What closing the gap is worth</div>
            <div class="v">${fmt.money(d.runRate)}</div>
            <div class="d">run-rate EBITDA · ${fmt.money(d.fees)} fees${d.oneTimeCash?' · '+fmt.money(d.oneTimeCash)+' one-time cash':''}</div>
            <div class="d"><b>${d.days} days</b> to first reading</div>
          </div>
          <div class="drv-do">
            <div class="l">What you do</div>
            <p>${d.how}</p>
            <div class="l" style="margin-top:8px">Owner &amp; weekly metric</div>
            <p><b>${d.owner}</b> — ${d.weekly}</p>
          </div>
        </div>
        <div class="calcbox">
          <div class="l">How the number is built</div>
          <table class="calc">${CALC[d.n].rows.map((r,i,arr)=>`<tr${i===arr.length-1?' class="last"':''}><td>${r[0]}</td><td class="num">${r[1]}</td><td class="mini">${r[2]||''}</td></tr>`).join('')}</table>
        </div>
        <div class="drv-foot">
          <div class="mini"><b>Evidence:</b> ${d.evidence}</div>
          <button class="btn" data-go="${d.prove}">Open ${d.proveLabel} →</button>
        </div>`));
      m.appendChild(el);
    });
    m.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.getAttribute('data-go'))));
  }
});


VIEWS.push({id:'utilization',n:99,label:'Demand utilization',title:'Demand utilization by office',driver:'Driver 3 · Demands out per team-week and the signed-cohort ramp · Owner: pre-lit managing attorney',segment:'inventory',bench:['demandsPerTeamWk','cycleDays','cmCaseload'],
  panel:{what:'The office cut of the demand step. Demands sent is the single most controllable number in the firm and the leading indicator of fees nine to fourteen months out; the cohort matrix shows how fast each office actually gets a demand out after signing.',lever:'Story 3 — move the file. A demand SLA of ten days from treatment end, AI-assisted drafting with attorney review, and a weekly stalled-file review. Bringing Phoenix to the Tampa ramp is the largest single throughput item in the plan.',owner:'Pre-lit managing attorney per office; case managers own their own desk\'s no-demand list. Reviewed weekly with the stalled-docket list.',guardrail:'First-offer \u00f7 demand ratio and demand error rate \u2014 a faster demand must not be a weaker demand.',bench:['demandsPerTeamWk','cycleDays','cmCaseload']},
  render(m){
    const W=win(),ids=offIds(),cur=aggOps(opsRows(W,ids));
    demandsUtil(m,W,ids,cur,true);
    const rows=D.OFFICES.filter(o=>ids.includes(o.id)).map(o=>{
      const a=aggOps(opsRows(W,[o.id]));
      const teams=Math.max(1,Math.round(a.cmDesks/3)), weeks=W.length*4.33;
      const sent=Math.round(a.demands*teams*weeks);
      const perFTE=a.staffedDesks?a.demands*teams/a.staffedDesks:0;
      const bl=D.inventory.filter(x=>x.office===o.id&&segOk(x)&&litOk(x)&&x.stage==='Demand'&&x.lastActivityDays>14).length;
      const rc=D.resolvedCases.filter(x=>x.office===o.id&&segOk(x)&&litOk(x)&&W.includes(x.settledMonth));
      return `<tr><td>${o.name}</td><td class="num">${fmt.int(sent)}</td><td class="num">${fmt.num(a.demands,1)} ${stIcon(a.demands>=4?0:a.demands>=3?2:3)}</td><td class="num">${fmt.num(perFTE,2)}</td><td class="num">${fmt.int(a.staffedDesks)}</td><td class="num">${teams}</td><td class="num">${rc.length?fmt.int(median(rc.map(x=>x.daysSignToDemand)))+' d':'\u2014'}</td><td class="num">${fmt.int(bl)}</td></tr>`;
    }).join('');
    // --- inactive open files by office × signed-age cohort ---
    {
      const TODAY=new Date(D.FIRM.asOf+'T00:00:00Z'), ago=(iso)=>Math.round((TODAY-new Date(iso+'T00:00:00Z'))/86400000);
      const pool=invLit().filter(x=>ids.includes(x.office)).map(x=>({office:x.office,age:ago(x.signDate),idle:x.lastActivityDays,fee:x.expectedFee}));
      const BK=[[0,30,'0–30 d'],[31,60,'31–60 d'],[61,90,'61–90 d'],[91,120,'91–120 d'],[121,180,'121–180 d'],[181,365,'181–365 d'],[366,1e9,'365 d+']];
      const RED=['#fdece4','#fbd3c2','#f7b39a','#ef8f70','#e26a4c','#cf4a33','#b02f22'];
      const cell=(g)=>{ if(!g.length) return '<td class="num mini">—</td>';
        const q=g.filter(x=>x.idle>30), pv2=q.length/g.length;
        const bg=RED[Math.min(6,Math.round(pv2*6))], ink=pv2>0.55?'#fff':'#0b0b0b';
        return `<td class="num" style="background:${bg};color:${ink}" data-tip="${fmt.int(q.length)} of ${fmt.int(g.length)} open files signed in this window have had no activity in 30+ days · ${fmt.money(q.reduce((a,x)=>a+x.fee,0))} probability-weighted fee">${fmt.pct(pv2)}<div class="mini" style="color:${ink};opacity:.75">${fmt.int(q.length)} of ${fmt.int(g.length)}</div></td>`; };
      const row=(label,f)=>`<tr><td>${label}</td>${BK.map(([lo,hi])=>cell(pool.filter(x=>f(x)&&x.age>=lo&&x.age<=hi))).join('')}</tr>`;
      m.appendChild(h(card(`Inactive open files by office — no activity in 30+ days, by time since signed`,
        `<div class="tbl-wrap"><table class="mtx"><thead><tr><th>Office</th>${BK.map(b=>`<th class="num">${b[2]}</th>`).join('')}</tr></thead><tbody>
          ${D.OFFICES.filter(o=>ids.includes(o.id)).map(o=>row(o.name,x=>x.office===o.id)).join('')}
          <tr class="total">${row('Firm',()=>true).slice(4)}</tbody></table></div>`,
        'The mirror of the matrix above: where files go quiet instead of moving. Read it against the demand ramp — a cohort that has not had a demand out and has not been touched in 30 days is the one that turns into a cycle-time problem two quarters from now. Some idleness in the 31–120 day columns is the treatment window and is expected; idleness past 180 days on a file with no demand out is not. Denominators differ from the matrix above by design: this one counts open files only, while the demand ramp counts every case signed in the window, resolved and dropped ones included. Hover a cell for the fee at risk. Source: Filevine › project.last_activity_at, project.signed_at, project.status = Open.')));
    }
    m.appendChild(h(card(`Demand utilization by office, ${pl()}`,`<div class="tbl-wrap"><table><thead><tr><th>Office</th><th class="num">Demands sent</th><th class="num">Per team-week</th><th class="num">Per CM per week</th><th class="num">Staffed desks</th><th class="num">Pre-lit teams</th><th class="num">Median signed\u2192demand</th><th class="num">Ready, no demand out</th></tr></thead><tbody>${rows}</tbody></table></div>`,
      'The same four numbers as the firm strip, cut by office, next to the median signed\u2192demand time each office actually achieves. An office below four demands per team-week with a long median is a capacity problem; one at four with a long median is a sequencing problem. Source: Filevine \u203a demand.sent_at, project.signed_at; ADP \u203a staffed case-manager desks.')));
  }
});

// --- pack scope: three cross-cutting views + the five KPI buckets (A–E) + the investor / diligence pack ---
const VIEW_ALIAS={plan:'drivers',exit:'flash',scorecard:'velocity',segment:'productivity',workforce:'productivity',ops:'drivers',calc:'drivers',toolkit:'flash'};
function secBar(letter,title,sub){
  return `<div class="secbar" style="grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;padding:0 0 6px;border-bottom:2px solid #2f2e2b">
    ${letter?`<span style="font:700 13px/1 var(--mono,ui-monospace,monospace);letter-spacing:.06em;background:#2f2e2b;color:#fff;padding:5px 8px;border-radius:3px">${letter}</span>`:''}
    <span style="font-weight:700;font-size:15px">${title}</span>
    <span style="color:#6b6a66;font-size:12.5px">${sub||''}</span></div>`;
}
(function(){
  const by=id=>VIEWS.find(v=>v.id===id);
  const prod=by('productivity'), seg=by('segment');
  // C — case mix and capacity: capacity (desks, caseload, throughput) then mix and margin
  const capacity={
    id:'productivity', label:'Case mix & capacity',
    title:'Case mix and capacity',
    driver:'Driver 2 · Cases per desk and fee per case type · Owners: pre-lit managing attorney, litigation director',
    segment:'segment',
    bench:['cmCaseload','demandsPerTeamWk','prelitPerAttorney','cycleDays'],
    panel:{
      what:'Capacity first — what a staffed case-manager desk actually produces each month and the caseload behind it — then mix: which case types the docket is made of and what each one earns after case costs and the capital it ties up.',
      lever:'Two levers meet here. Throughput per desk (demand SLA ≤10 days, weekly stalled-file review) and mix (shift marketing spend toward the segments that clear on fee per case after cost of capital, not gross settlement).',
      owner:'Pre-lit managing attorney owns capacity; litigation director owns mix. Reviewed together monthly so a mix shift is matched with desks.',
      guardrail:'Caseload per desk inside the PELA 80–120 band, and fee dispersion — a mix shift that lifts the mean while the median falls is concentration, not improvement.',
      bench:['cmCaseload','demandsPerTeamWk','cycleDays']
    },
    render(m){
      m.insertAdjacentHTML('beforeend',secBar('','Capacity — output per staffed desk','desks · caseload · demands per team-week'));
      prod.render(m);
      m.insertAdjacentHTML('beforeend',secBar('','Mix — what each case type earns','fee per resolved case after case costs and capital'));
      seg.render(m);
    }
  };
  const relabel={
    flash:{label:'Executive flash'},
    drivers:{label:'EBITDA drivers', title:'EBITDA drivers — the five that move the number'},
    funnel:{label:'Demand capture', title:'Demand capture', driver:'Driver 1 · Contact rate × sign rate; cost per signed case · Owners: intake manager, marketing director'},
    velocity:{label:'Case velocity', title:'Case velocity', driver:'Driver 3 · Days in stage, demands sent, stalled files · Owner: office managing attorney'},
    workingcap:{label:'Money at the end of the pipe', title:'Money at the end of the pipe', driver:'Driver 4 · Realized fee, case-cost capital, disbursement lag · Owner: CFO / controller'},
    recurring:{label:'Client experience', title:'Client experience (lagging)', driver:'Drivers 1 & 2 · Referral and past-client share, partner retention · Owner: client experience lead'},
    exit:{label:'Investor & diligence pack', title:'Investor and diligence pack — revenue quality and the tie-out', driver:'Same-store growth, fee mix, realized fee rate, referral economics, close speed · Owner: CFO / controller'}
  };
  const order=['flash','drivers','funnel','velocity','utilization','productivity','workingcap','recurring'];
  const kept=order.map(id=>id==='productivity'?capacity:by(id)).filter(Boolean);
  kept.forEach(v=>{ const r=relabel[v.id]; if(r) Object.assign(v,r); });
  VIEWS.length=0; kept.forEach((v,i)=>{ v.n=i+1; VIEWS.push(v); });
  if(!VIEWS.some(v=>v.id===state.view)) state.view=VIEWS[0].id;
})();
function go(id){ if(!VIEWS.some(v=>v.id===id)&&VIEW_ALIAS[id]) id=VIEW_ALIAS[id]; state.view=id; if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); render(); window.scrollTo(0,0); }
function render(){
  const V=VIEWS.find(v=>v.id===state.view)||VIEWS[0];
  nav.querySelectorAll('button[data-view]').forEach(b=>b.classList.toggle('active',b.getAttribute('data-view')===V.id));
  document.querySelectorAll('.view').forEach(sec=>sec.classList.toggle('active',sec.id==='v-'+V.id));
  const fs=document.getElementById('f-segment'); fs.disabled=!V.segment; document.getElementById('f-hint').textContent=V.segment?(V.segment==='inventory'?'Segment filter applies to inventory-based figures on this view.':'Segment filter applies to this view.'):'Segment filter is not applicable to this view (office and period apply).';
  const sec=document.getElementById('v-'+V.id);
  sec.innerHTML=`<div class="vhead"><div class="t"><h1 id="t-${V.id}">${V.title}</h1><div class="driver">${V.driver} · Scope: ${scopeName()}, ${pl()} (to ${fmt.month(LATEST)})</div></div><div class="disc">${esc(D.FIRM.disclaimer)}<br>Prepared by North Castle Consulting · as of ${fmt.date(D.FIRM.asOf)}</div></div>${V.bench?`<div class="bench-strip"><span class="lbl">Benchmarks</span>${V.bench.map(benchChip).join('')}</div>`:''}<div class="vbody"><div class="vmain"></div><aside class="vpanel"><div class="block"><h3>What this is for</h3><p>${V.panel.what}</p></div><div class="block"><h3>Value lever</h3><p>${V.panel.lever}</p></div><div class="block"><h3>Owner &amp; cadence</h3><p>${V.panel.owner}</p></div><div class="block"><h3>Guardrail</h3><p>${V.panel.guardrail}</p></div><div class="block bench"><h3>Outside benchmark</h3>${V.panel.bench.map(benchRow).join('')}</div></aside></div>`;
  SRCREG=[];
  V.render(sec.querySelector('.vmain'));
  renderFootnotes([].concat(V.bench||[],(V.panel&&V.panel.bench)||[]));
}
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(render,150); });
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(VIEWS.some(v=>v.id===id)&&id!==state.view){ state.view=id; render(); } });
buildShell();
{ const id=location.hash.slice(1); if(VIEWS.some(v=>v.id===id)) state.view=id; }
render();
window.__PACK={state,VIEWS,go,render};
})();
