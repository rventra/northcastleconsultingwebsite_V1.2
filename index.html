<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 
      NORTH CASTLE CONSULTING - META TAGS
      ===================================
      IMPORTANT: For LinkedIn Ads and social sharing to work, OG tags must be 
      present in this static HTML file. React Helmet/meta tags added at runtime 
      will NOT work for link preview crawlers.
      
      When creating new landing pages:
      1. Update the title, description, and og:url below
      2. Create a 1200x627px OG image and upload to public/images/
      3. Update og:image and twitter:image paths
      4. Test with LinkedIn Post Inspector before launching ads
      
      See AGENTS.md for full SOP on landing page meta tags.
    -->
    
    <!--
      Primary Meta Tags = SITE-WIDE DEFAULTS.
      This is a single-page app: this static <head> is shared by every route and
      is what social crawlers / view-source see. Per-page <title>/<description>/
      canonical are set at runtime by src/components/MetaTags.jsx (works for
      browsers and JS-executing crawlers like Google). Keep these values generic
      to the brand — do NOT hardcode a single landing page's metadata here.
    -->
    <title>North Castle Consulting | Financial Advisory for PE &amp; Corporate Development</title>
    <meta name="title" content="North Castle Consulting | Financial Advisory for PE & Corporate Development">
    <meta name="description" content="Financial expertise for Private Equity and Corporate Development teams seeking measurable outcomes. Sell-side readiness, M&A support, and data infrastructure.">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://northcastleconsulting.com/">
    <meta property="og:title" content="North Castle Consulting | Financial Advisory for PE & Corporate Development">
    <meta property="og:description" content="Financial expertise for Private Equity and Corporate Development teams seeking measurable outcomes. Sell-side readiness, M&A support, and data infrastructure.">
    <meta property="og:image" content="https://northcastleconsulting.com/images/hero-bg.jpg">
    <meta property="og:site_name" content="North Castle Consulting">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://northcastleconsulting.com/">
    <meta property="twitter:title" content="North Castle Consulting | Financial Advisory for PE & Corporate Development">
    <meta property="twitter:description" content="Financial expertise for Private Equity and Corporate Development teams seeking measurable outcomes. Sell-side readiness, M&A support, and data infrastructure.">
    <meta property="twitter:image" content="https://northcastleconsulting.com/images/hero-bg.jpg">

    <!-- Additional SEO Tags -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="North Castle Consulting">
    <link rel="canonical" href="https://northcastleconsulting.com/">

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-WLMPS75V');</script>
    <!-- End Google Tag Manager -->

    <!-- LinkedIn Insight Tag -->
    <script type="text/javascript">
    _linkedin_partner_id = "7930930";
    window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
    window._linkedin_data_partner_ids.push(_linkedin_partner_id);
    </script>
    <script type="text/javascript">
    (function(l) {
    if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
    window.lintrk.q=[]}
    var s = document.getElementsByTagName("script")[0];
    var b = document.createElement("script");
    b.type = "text/javascript";b.async = true;
    b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
    s.parentNode.insertBefore(b, s);})(window.lintrk);
    </script>
    <!-- End LinkedIn Insight Tag -->
  </head>

</html>
