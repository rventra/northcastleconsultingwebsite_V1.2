<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 
      NORTH CASTLE CONSULTING - META TAGS
      ===================================
      IMPORTANT: For LinkedIn Ads and social sharing to work, OG tags must be 
      present in this static HTML file. React Helmet/meta tags added at runtime 
      will NOT work for link preview crawlers.
      
      When creating new landing pages:
      1. Update the title, description, and og:url below
      2. Create a 1200x627px OG image and upload to public/images/
      3. Update og:image and twitter:image paths
      4. Test with LinkedIn Post Inspector before launching ads
      
      See AGENTS.md for full SOP on landing page meta tags.
    -->
    
    <!-- Primary Meta Tags -->
    <title>Roundup Docket Intelligence | North Castle Consulting</title>
    <meta name="title" content="Roundup Docket Intelligence | North Castle Consulting">
    <meta name="description" content="Actionable intelligence and data infrastructure for Roundup mass tort litigation. Know what your docket is worth before you walk into settlement negotiations.">
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://northcastleconsulting.com/roundup-docket-intelligence">
    <meta property="og:title" content="Roundup Docket Intelligence | North Castle Consulting">
    <meta property="og:description" content="Actionable intelligence and data infrastructure for Roundup mass tort litigation. Know what your docket is worth before you walk into settlement negotiations.">
    <meta property="og:image" content="https://northcastleconsulting.com/images/roundup-og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="627">
    <meta property="og:site_name" content="North Castle Consulting">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://northcastleconsulting.com/roundup-docket-intelligence">
    <meta property="twitter:title" content="Roundup Docket Intelligence | North Castle Consulting">
    <meta property="twitter:description" content="Actionable intelligence and data infrastructure for Roundup mass tort litigation. Know what your docket is worth before you walk into settlement negotiations.">
    <meta property="twitter:image" content="https://northcastleconsulting.com/images/roundup-og-image.png">
    
    <!-- Additional SEO Tags -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="North Castle Consulting">
    <link rel="canonical" href="https://northcastleconsulting.com/roundup-docket-intelligence">
